## Registry dependencies the BSP needs. Everything local (the BSP itself, the
## Himax sscma_client, LVGL) is supplied by EXTRA_COMPONENT_DIRS in the
## top-level CMakeLists, pointing into the vendored SDK.
dependencies:
  idf:
    version: ">=5.2"
  # Upstream LVGL, not the SDK's vendored fork — see the top-level CMakeLists.
  lvgl/lvgl:
    version: "~8.4.0"
  # Vapi's transport: a TLS websocket carrying raw PCM.
  espressif/esp_websocket_client:
    version: "^1.5.0"
  espressif/esp_lcd_spd2010:
    version: "1.0.1"
  espressif/esp_lcd_touch_spd2010:
    version: "0.0.1"
  # Vendored 1.3.6 via override_path, NOT the registry's 1.2.0 that the BSP
  # manifest pins. Reason: IDF aborts in a *global constructor* at boot —
  # before app_main — if both the legacy driver/i2c.h and the new
  # driver/i2c_master.h implementations are merely linked into the image:
  #   E i2c: CONFLICT! driver_ng is not allowed to be used with this old driver
  # (check_i2c_driver_conflict, i2c.c:1738, reached from do_global_ctors).
  # So it is not enough to avoid calling the codec — its presence alone is
  # fatal. esp_codec_dev 1.2.0 hard-selects the new API on IDF >= 5.3 with no
  # opt-out; 1.3.x adds CONFIG_CODEC_I2C_BACKWARD_COMPATIBLE, which keeps it on
  # the legacy driver and matches the BSP. override_path bypasses the version
  # solver, which would otherwise reject 1.3.x against the BSP's exact pin.
  espressif/esp_codec_dev:
    override_path: "../components/esp_codec_dev"
  led_strip:
    version: "2.5.4"
  button:
    version: "3.2.3"
